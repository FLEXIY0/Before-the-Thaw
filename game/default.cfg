// Before the Thaw - default settings.
// Personal changes are written by the engine to config.cfg (not in git).

unbindall
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "UPARROW" "+forward"
bind "DOWNARROW" "+back"
bind "LEFTARROW" "+left"
bind "RIGHTARROW" "+right"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "c" "+duck"
bind "SHIFT" "+speed"
bind "e" "+use"
bind "MOUSE1" "+use"
bind "MOUSE2" "+use"
bind "ESCAPE" "cancelselect"
bind "`" "toggleconsole"
bind "~" "toggleconsole"
bind "F5" "snapshot"
bind "F6" "save quick"
bind "F9" "load quick"
bind "PAUSE" "pause"

// controls
sensitivity "3"
m_pitch "0.022"
m_yaw "0.022"
cl_forwardspeed "400"
cl_sidespeed "400"
cl_backspeed "400"
cl_movespeedkey "0.4"

// late-90s look: pixel-sharp textures, smooth lightmaps
gl_texture_nearest "1"
gl_lightmap_nearest "0"
fov "90"
fps_max "100"
r_dynamic "1"
crosshair "0"
hud_draw "1"

// sound
volume "0.8"
